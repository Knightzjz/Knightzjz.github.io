name: Update Scholar Citations

on:
  schedule:
    # Daily at Beijing 06:00, 14:00, 22:00 (UTC 22:00, 6:00, 14:00).
    # Shifted 2h earlier to absorb GitHub's ~2h scheduled-run delay, so the
    # real SerpAPI fetch lands near Beijing 08:00 / 16:00 / 24:00.
    # 3 runs/day × 31 ≈ 93 searches/month — well under the 250/month plan.
    - cron: '0 22,6,14 * * *'
  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize with the stars workflow — if stars is still running,
    # this one waits instead of producing a non-fast-forward push conflict.
    concurrency:
      group: site-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch citations via SerpAPI
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/fetch_citations.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add citations.json
          if git diff --cached --quiet; then
            echo "No change, skipping commit."
          else
            git commit -m "chore: update scholar citations [skip ci]"
            git push
          fi
