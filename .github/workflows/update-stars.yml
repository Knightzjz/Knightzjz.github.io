name: Update GitHub Stars

on:
  schedule:
    # Daily at Beijing 08:15, 16:15, 00:15 (UTC 0:15, 8:15, 16:15).
    # 15-min stagger after citations (Beijing 08:00/16:00/24:00) + shared
    # concurrency group prevents non-fast-forward push conflicts.
    - cron: '15 0,8,16 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: site-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch star counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_stars.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stars.json
          if git diff --cached --quiet; then
            echo "No change, skipping commit."
          else
            git commit -m "chore: update github stars [skip ci]"
            git push
          fi
