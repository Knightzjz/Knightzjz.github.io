name: Update GitHub Stars

on:
  schedule:
    # Daily at Beijing 06:15, 14:15, 22:15 (UTC 22:15, 6:15, 14:15).
    # Shifted 2h earlier to track citations; 15-min stagger after citations
    # (Beijing 06:00/14:00/22:00) + shared concurrency group prevents
    # non-fast-forward push conflicts.
    - cron: '15 22,6,14 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: site-data
      cancel-in-progress: false
    steps:
      # See update-citations.yml — the token is re-attached only for the push.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch star counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_stars.py

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add stars.json
          if git diff --cached --quiet; then
            echo "No change, skipping commit."
          else
            git commit -m "chore: update github stars [skip ci]"
            git push
          fi
