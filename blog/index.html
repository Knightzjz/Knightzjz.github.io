  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .skip-link {
      position: absolute; top: -100px; left: 0;
      background: #2563eb; color: #fff; padding: 8px 16px;
      z-index: 1000; font-size: 0.9rem; border-radius: 0 0 8px 0;
      text-decoration: none;
    }
    .skip-link:focus { top: 0; outline: 2px solid #f59e0b; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #ffffff;
      color: #1e293b;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding: calc(2.75rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right)) calc(3rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
    }

    /* Floating emojis */
    .beans {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bean {
      position: absolute;
      font-size: 1.6rem;
      opacity: 0.12;
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.12; }
      90%  { opacity: 0.12; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .blog-title {
      display: inline-block;
      background: #ffffff;            /* opaque backdrop — hides emojis behind */
      border-radius: 14px;
      padding: 0.12em 0.45em;
      margin-bottom: 2.25rem;
      user-select: none;
    }
    .blog-title-text {
      font-size: clamp(2.5rem, 7.5vw, 4.2rem);
      font-weight: 800;
      line-height: 1.05;
      background: linear-gradient(135deg, #2563eb 0%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Cover (latest highlight) — photo + only time & location, no prose ── */
    .cover {
      width: 100%;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(30, 41, 59, 0.12), 0 8px 24px rgba(30, 41, 59, 0.06);
      overflow: hidden;
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .cover-meta {
      padding: 1.1rem 1.2rem 1.3rem;
      text-align: center;
    }
    .cover-date {
      display: block;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #1e293b;
    }
    .cover-loc {
      display: block;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: #64748b;
      letter-spacing: 0.04em;
    }

    /* ── Volume marker — sits below the cover ── */
    .incoming {
      margin: 2.75rem 0 2.25rem;
      font-size: clamp(1.1rem, 2.8vw, 1.4rem);
      font-weight: 600;
      color: #1e293b;
    }
    .incoming .in {
      color: #0f766e;
      font-style: italic;
      font-weight: 800;
    }

    /* ── Blog post list — one card per row (一条一条) ── */
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 2.75rem;
      width: 100%;
    }

    .photo-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(30, 41, 59, 0.12), 0 8px 24px rgba(30, 41, 59, 0.06);
      overflow: hidden;
      width: 100%;
      border: 1px solid rgba(226, 232, 240, 0.8);
      text-align: left;
    }
    /* ── Card hover — cover & post cards share the same effect ── */
    .cover, .photo-card {
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .cover:hover, .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 26px 70px rgba(30, 41, 59, 0.18), 0 10px 28px rgba(30, 41, 59, 0.08);
      border-color: rgba(37, 99, 235, 0.28);
    }
    .cover:hover .photo-real, .photo-card:hover .photo-real { transform: scale(1.03); }

    .photo-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #e2e8f0;
      overflow: hidden;
    }

    .photo-placeholder {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(18px) saturate(1.1);
      transform: scale(1.05);
      transition: opacity 0.6s ease;
    }

    .photo-real {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease, transform 0.45s ease;
    }
    .photo-real.loaded { opacity: 1; }
    .photo-wrap:has(.photo-real.loaded) .photo-placeholder { opacity: 0; }

    .photo-caption {
      padding: 1.4rem 1.6rem;
      background: #fff;
    }
    .post-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.7rem;
    }
    .post-date {
      font-size: 0.78rem;
      font-weight: 700;
      color: #0f766e;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .post-views {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.78rem;
      color: #64748b;
    }
    .photo-caption p {
      font-size: 1rem;
      color: #475569;
      line-height: 1.7;
    }
    .photo-caption .pun-line {
      display: block;
      margin-top: 0.6rem;
      font-size: 1.1rem;
      font-weight: 600;
      font-style: italic;
      color: #0f766e;
      letter-spacing: 0.02em;
    }
    .post-title {
      font-size: 1.3rem; font-weight: 700; color: #0f172a;
      margin-bottom: 0.65rem; line-height: 1.4;
    }
    .post-title a { color: inherit; text-decoration: none; }
    .post-title a:hover { color: #2563eb; }
    .read-more {
      display: inline-block; margin-top: 0.9rem;
      color: #2563eb; font-weight: 600; text-decoration: none;
    }
    .read-more:hover { text-decoration: underline; }

    .photo-caption .loc {
      font-size: 0.85rem;
      color: #64748b;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.6rem;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 3rem;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .cta:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #cbd5e1;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .bean { animation: none !important; }
      .photo-placeholder, .photo-real { transition: none !important; }
      .cta { transition: none !important; }
      .cover, .photo-card { transition: none !important; }
      .cover:hover, .photo-card:hover { transform: none; }
      .cover:hover .photo-real, .photo-card:hover .photo-real { transform: none; }
    }

    /* Touch devices: no hover lift */
    @media (hover: none) and (pointer: coarse) {
      .cover:hover, .photo-card:hover { transform: none; }
      .cover:hover .photo-real, .photo-card:hover .photo-real { transform: none; }
    }

    @media (max-width: 640px) {
      body { padding: 2rem 1rem 2.5rem; }
      .post-list { gap: 2rem; }
      .photo-caption { padding: 1.1rem 1.2rem; }
      .photo-caption p { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <a href="#post-list" class="skip-link">Skip to posts</a>

  <!-- Floating emojis -->
  <div class="beans" id="beans" aria-hidden="true"></div>

  <div class="container">
    <h1 class="blog-title"><span class="blog-title-text">Eat More Digest</span></h1>

    <p class="incoming"><span class="in">Volume 1</span></p>

    <main class="post-list" id="post-list" aria-label="Blog posts">

      <!-- COVER — photo moment, moved below the posts (2026-08-29).

      <!-- ════════════════════════════════════════════════════════════

      <!-- ══════════════════ NEW POST TEMPLATE ══════════════════

             1) Copy everything between the TEMPLATE markers and uncomment it.

        </div>
      </article>
      ══════════════════ END NEW POST TEMPLATE ══════════════════ -->

    </main>

    <a href="/" class="cta">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back to Home
    </a>

    <div class="footer">© 2026 Ji-Zhe Zhou</div>
  </div>

  <script>
    // Progressive photo reveal (blur-up) for every post image — no inline onload needed.
    (function () {
      document.querySelectorAll('.photo-real').forEach(function (img) {
        function done() { img.classList.add('loaded'); }
        if (img.complete && img.naturalWidth > 0) done();
        else img.addEventListener('load', done);
      });
    })();

    // Generate floating emojis (skip if user prefers reduced motion)
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var emojis = ['✨', '🌊', '🐚', '☀️', '📝'];
      var container = document.getElementById('beans');
      for (var i = 0; i < 25; i++) {
        var span = document.createElement('span');
        span.className = 'bean';
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        span.style.left = Math.random() * 100 + '%';
        span.style.animationDuration = (12 + Math.random() * 18) + 's';
        span.style.animationDelay = -(Math.random() * 20) + 's';
        span.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
        container.appendChild(span);
      }
    })();

    // Read count for the unified-fid post (read-only; the article page increments)
    (function () {
      var el = document.getElementById('ufid-views');
      if (!el) return;
      fetch('https://countapi.mileshilliard.com/api/v1/get/knightzjz-blog-unified-fid-views')
        .then(function (r) { return r.json(); })
        .then(function (j) {
          var v = j && j.value;
          if (v !== undefined && v !== null && Number.isFinite(Number(v)) && Number(v) > 0) {
            el.textContent = '👁 ' + Number(v).toLocaleString() + ' 次阅读';
            el.hidden = false;
          }
        })
        .catch(function () { /* silent */ });
    })();
  </script>
